<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klikkbar modell av Hverdagshelten-appen</title>
<meta name="description" content="Prøv Hverdagshelten-appen før den kommer. Trykk deg rundt som Anne, som bestiller hjelp, eller som Emil, som tar oppdrag. Alle navn og avtaler er eksempler.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://hverdagsheltenub.github.io/hverdagshelten-nettside/prototype/">
<meta name="theme-color" content="#FFF6EC">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script>
  // Vist inne i nettsiden (prototype/?innebygd=1): gjennomsiktig bakgrunn og ingen ekstra lenker.
  if (new URLSearchParams(location.search).has('innebygd')) document.documentElement.classList.add('innebygd');
</script>
<style>
  /* Fargene fra appen */
  :root {
    --krem: #FDF8F2; --fersken: #F8E4CF; --fersken-lys: #FBEEDF;
    --lilla: #4D3B5C; --lilla-mork: #3E2F4B; --lilla-lys: #E7E0EE;
    --tekst: #2B2230; --dempet: #66596D; --linje: #E9DED3; --kort: #FFFDFA;
    --gronn: #2F7A55; --gronn-lys: #E3F1E8; --stjerne: #B9821F;
    --s: 1; /* tekstskala, 1.15 med «Større tekst» */
    --easing: cubic-bezier(.22, .8, .3, 1);
    font-family: "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #FFF6EC; color: var(--tekst); -webkit-font-smoothing: antialiased; }
  html.innebygd body { background: transparent; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--tekst); outline-offset: 2px; border-radius: 8px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .side { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px 16px 32px; }
  html.innebygd .side { padding: 4px 0 8px; }
  .forklaring { text-align: center; max-width: 30rem; }
  .forklaring h1 { font-size: 1.6rem; margin: 0 0 .3rem; color: #3E2A48; }
  .forklaring p { margin: 0; font-size: 1.1rem; line-height: 1.5; }
  .forklaring a { color: #52395E; font-weight: 700; }
  /* Innebygd: nettsiden har allerede overskrift og lenker, så vi beholder bare overskriften for skjermlesere */
  html.innebygd .forklaring p, html.innebygd .merknad { display: none; }
  html.innebygd .forklaring h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .merknad { font-size: 1rem; color: #5B4F63; margin: 0; }

  /* Bytt mellom Anne og Emil */
  .rollevalg { display: flex; gap: 6px; padding: 5px; background: #fff; border: 2px solid var(--linje); border-radius: 999px; }
  .rollevalg button {
    min-height: 48px; padding: 0 18px; border: 0; border-radius: 999px; background: transparent; cursor: pointer;
    font-size: 17px; font-weight: 700; color: var(--lilla-mork); transition: background-color .25s, color .25s;
  }
  .rollevalg button span { font-weight: 400; }
  .rollevalg button[aria-pressed="true"] { background: var(--lilla); color: #fff; }

  /* Telefonen */
  .telefon { width: 410px; padding: 10px; border-radius: 52px; background: #2B2230; }
  .skjerm {
    position: relative; height: 780px; border-radius: 42px; overflow: hidden; background: var(--krem);
    display: flex; flex-direction: column;
  }
  .statuslinje { flex: none; display: flex; justify-content: space-between; padding: 14px 28px 4px; font-size: 14px; font-weight: 700; }
  @media (max-width: 419px) {
    .side { padding: 12px 0 24px; }
    .telefon { width: 100%; padding: 0; border-radius: 0; background: none; }
    .skjerm { border-radius: 24px; border: 2px solid var(--linje); height: 760px; }
    .statuslinje { display: none; }
    .rollevalg button { padding: 0 12px; font-size: 16px; }
  }

  .innhold { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 14px 20px 28px; scrollbar-width: thin; }
  .liste { display: flex; flex-direction: column; gap: 16px; }

  /* Tekst */
  .tittel { font-size: calc(28px * var(--s)); font-weight: 700; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
  .under { font-size: calc(15px * var(--s)); color: var(--dempet); margin: 2px 0 0; line-height: 1.35; }
  .mellom { font-size: calc(19px * var(--s)); font-weight: 700; margin: 0; }
  .stor { font-size: calc(22px * var(--s)); font-weight: 700; line-height: 1.2; margin: 0; }
  .brod { font-size: calc(17px * var(--s)); margin: 0; line-height: 1.4; }
  .listetittel { font-size: calc(18px * var(--s)); font-weight: 700; margin: 0; line-height: 1.3; }
  .fet { font-weight: 700; }
  .seksjon-tittel { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }

  /* Kort og knapper */
  .kort { background: var(--kort); border: 1.5px solid var(--linje); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .kort.myk { background: var(--fersken-lys); border-color: var(--fersken-lys); }
  .rad { display: flex; flex-direction: row; align-items: center; gap: 14px; }
  .rad > .vokse { flex: 1; min-width: 0; }
  .topp-rad { display: flex; align-items: flex-start; gap: 12px; }
  .topp-rad > .vokse { flex: 1; }
  .linje { height: 1.5px; background: var(--linje); }
  .ikonboks { flex: none; width: 48px; height: 48px; border-radius: 14px; background: var(--fersken); display: grid; place-items: center; color: var(--lilla-mork); font-size: 20px; font-weight: 700; }
  .ikon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .avatar { flex: none; border-radius: 50%; background: var(--lilla); color: #fff; display: grid; place-items: center; font-weight: 700; width: 44px; height: 44px; font-size: 19px; }
  .avatar.stor-avatar { width: 72px; height: 72px; font-size: 30px; }

  .trykk { cursor: pointer; transition: transform .12s ease; text-align: left; -webkit-tap-highlight-color: transparent; }
  .trykk:active { transform: scale(.97); }
  button.kort { width: 100%; }

  .knapp {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    min-height: 60px; padding: 0 24px; border-radius: 999px; border: 0; cursor: pointer;
    background: var(--lilla); color: #fff; font-size: calc(19px * var(--s)); font-weight: 700;
    transition: transform .12s ease, background-color .25s;
  }
  .knapp:active { transform: scale(.97); }
  @media (hover: hover) {
    .knapp:hover { background: var(--lilla-mork); }
    .knapp.sekundar:hover, .chip:not([aria-pressed="true"]):hover, button.kort:hover { border-color: var(--lilla); }
    .knapp.gronn:hover { background: #256645; }
    .lenkerad:hover, .tilbake:hover { text-decoration: underline; }
  }
  .knapp .ikon { width: 22px; height: 22px; }
  .knapp.sekundar { background: var(--kort); color: var(--lilla-mork); border: 1.5px solid var(--linje); }
  .knapp.gronn { background: var(--gronn); }
  .knapp.liten { min-height: 46px; font-size: calc(16px * var(--s)); padding: 0 12px; gap: 8px; }
  .knapp.liten .ikon { width: 18px; height: 18px; }
  .knapper { display: flex; gap: 10px; }

  .lenkerad { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 4px 0; min-height: 44px; cursor: pointer; color: var(--lilla); font-weight: 700; font-size: calc(17px * var(--s)); }
  .tilbake { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; background: none; border: 0; padding: 6px 0; min-height: 44px; cursor: pointer; color: var(--lilla); font-weight: 700; font-size: calc(16px * var(--s)); }
  .tilbake .ikon { width: 20px; height: 20px; }
  .steg { color: var(--lilla); font-weight: 700; font-size: calc(15px * var(--s)); margin: 0; }

  .pille { align-self: flex-start; flex: none; border-radius: 999px; padding: 3px 10px; font-size: calc(12px * var(--s)); font-weight: 700; background: var(--fersken); color: var(--lilla-mork); white-space: nowrap; }
  .pille.gronn { background: var(--gronn-lys); color: var(--gronn); }
  .pille.lilla { background: var(--lilla-lys); color: var(--lilla); }

  .stjerner { display: flex; gap: 2px; color: var(--stjerne); }
  .stjerner .ikon { width: 18px; height: 18px; fill: currentColor; }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border-radius: 999px; border: 1.5px solid var(--linje); background: var(--kort); padding: 10px 16px; min-height: 44px;
    font-size: calc(16px * var(--s)); font-weight: 700; cursor: pointer; transition: background-color .25s, color .25s, border-color .25s, transform .12s;
  }
  .chip:active { transform: scale(.97); }
  .chip[aria-pressed="true"] { background: var(--lilla); border-color: var(--lilla); color: #fff; }

  .bryter { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 44px; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .bryter .listetittel { flex: 1; font-weight: 400; }
  .spor { flex: none; width: 52px; height: 30px; border-radius: 999px; background: var(--linje); padding: 3px; transition: background-color .25s; }
  .knott { display: block; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .25s var(--easing); }
  .bryter[aria-checked="true"] .spor { background: var(--lilla); }
  .bryter[aria-checked="true"] .knott { transform: translateX(22px); }

  .stat-rad { display: flex; gap: 12px; }
  .stat { flex: 1; background: var(--fersken-lys); border-radius: 18px; padding: 16px; }
  .stat .stor { display: flex; align-items: center; gap: 6px; }
  .stat .stor .ikon { color: var(--stjerne); fill: currentColor; width: 22px; height: 22px; }

  .pris-rad { display: flex; justify-content: space-between; gap: 8px; }
  .profil-topp { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
  .belop { font-size: calc(18px * var(--s)); font-weight: 700; white-space: nowrap; }
  .midt { text-align: center; }

  /* Kartet */
  .kart { position: relative; height: 270px; border-radius: 18px; border: 1.5px solid var(--linje); overflow: hidden; background: #F3EADF; }
  .kart svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .kart .omrade { position: absolute; font-size: 12px; font-weight: 700; color: #786C7E; }
  .nal { position: absolute; width: 34px; margin: -42px 0 0 -17px; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; }
  button.nal { cursor: pointer; }
  .nal-hode { width: 34px; height: 34px; border-radius: 50%; background: var(--lilla); border: 3px solid #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; color: var(--lilla-mork); }
  .nal-hode::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .nal.nummer .nal-hode { background: var(--fersken); border-color: var(--lilla); }
  .nal.nummer .nal-hode::after { display: none; }
  .nal-spiss { width: 12px; height: 12px; margin-top: -8px; background: var(--lilla); transform: rotate(45deg); position: relative; z-index: -1; }

  /* Bunnmenyen */
  .meny { flex: none; display: flex; gap: 6px; padding: 10px 10px 14px; background: var(--lilla); }
  .meny[hidden] { display: none; }
  .meny button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0; min-height: 56px;
    border: 0; border-radius: 16px; background: transparent; color: #fff; cursor: pointer; font-size: 15px;
    transition: background-color .25s, transform .12s;
  }
  .meny button:active { transform: scale(.97); }
  .meny button[aria-current="page"] { background: var(--fersken); color: var(--lilla-mork); font-weight: 700; }
  .meny :focus-visible { outline-color: #fff; }

  /* Toast */
  .toast {
    position: absolute; left: 16px; right: 16px; bottom: 96px; z-index: 5;
    background: var(--lilla-mork); color: #fff; border-radius: 16px; padding: 14px 18px; font-size: 16px; font-weight: 700; line-height: 1.4;
    opacity: 0; transform: translateY(24px); pointer-events: none; transition: opacity .3s, transform .38s var(--easing);
  }
  .toast.vis { opacity: 1; transform: none; }
  .meny[hidden] ~ .toast { bottom: 20px; }

  /* Overganger. Uten «Reduser bevegelse» glir skjermene inn fra siden. */
  @keyframes fremInn { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes tilbakeInn { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
  @keyframes rolleInn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes loft { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .innhold.frem { animation: fremInn .38s var(--easing) both; }
    .innhold.tilbake { animation: tilbakeInn .38s var(--easing) both; }
    .innhold.rolle { animation: rolleInn .45s var(--easing) both; }
    .innhold .liste > * { animation: loft .38s var(--easing) both; animation-delay: calc(min(var(--i, 0), 4) * 30ms); }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { transform: none; transition: opacity .2s; }
    .knott, .trykk, .knapp, .chip { transition: none; }
  }
</style>
</head>
<body>
<main class="side">
  <div class="forklaring">
    <h1>Prøv appen før den kommer</h1>
    <p>Trykk deg rundt som Anne eller Emil. <a href="../#prov-appen">Tilbake til nettsiden</a></p>
  </div>

  <div class="rollevalg" role="group" aria-label="Hvem vil du være?">
    <button type="button" data-rolle="anne" aria-pressed="true">Anne <span>bestiller hjelp</span></button>
    <button type="button" data-rolle="emil" aria-pressed="false">Emil <span>tar oppdrag</span></button>
  </div>

  <div class="telefon">
    <div class="skjerm" id="skjerm">
      <div class="statuslinje" aria-hidden="true"><span>09:41</span><span>4G</span></div>
      <div class="innhold" id="innhold"></div>
      <nav class="meny" id="meny" aria-label="Appmeny"></nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <p class="merknad">Alle navn og avtaler er eksempler.</p>
</main>

  };
  function ikon(navn) { return '<svg class="ikon" viewBox="0 0 24 24" aria-hidden="true">' + STIER[navn] + '</svg>'; }

  // ---------- Eksempeldata (samme som i appen) ----------

    ['Hjelp hjemme', 'Enkle oppgaver i hjemmet', 'hus'],
    ['Handling', 'Hjelp med dagligvarer', 'handlevogn'],

      innhold.scrollTop = 0;
    }
    if (flyttFokus) {
      var h = innhold.querySelector('.tittel');
      if (h) h.focus({ preventScroll: true });
    }
  }

  function ga(skjermNavn, retning) { t.skjerm = skjermNavn; tegn(retning, true); }

  function visToast(tekst) {
    clearTimeout(toastTimer);
    toastEl.textContent = tekst;
    toastEl.classList.add('vis');
    toastTimer = setTimeout(function () { toastEl.classList.remove('vis'); }, 2400);
  }

  function settRolle(rolle, beholdSkjerm) {
    t.rolle = rolle;
    if (!beholdSkjerm) t.skjerm = 'hjem';
    document.querySelectorAll('[data-rolle]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-rolle') === rolle ? 'true' : 'false'); });
    tegn('rolle', beholdSkjerm);
  }

  var HANDLINGER = {
    fane: function (v) {
      if (v === t.skjerm) return;
      var fra = FANER.indexOf(t.skjerm), til = FANER.indexOf(v);
      ga(v, fra < 0 || til > fra ? 'frem' : 'tilbake');
    },
    bestill: function () { t.steg = 1; ga('bestill', 'frem'); },
    hjem: function () { ga('hjem', 'tilbake'); },
    velgKategori: function (v) { t.kategori = v; t.steg = 2; tegn('frem', true); },
    steg: function (v) { var ny = Number(v); var r = ny > t.steg ? 'frem' : 'tilbake'; t.steg = ny; tegn(r, true); },
    dag: function (v) { t.dag = v; tegn(); },
    tid: function (v) { t.tid = v; tegn(); },
    send: function () {
      t.bestillinger.push({ kategori: t.kategori, dag: t.dag, tid: t.tid });
      ga('hjem', 'tilbake');
      visToast('Bestillingen er sendt. Du får beskjed når en hjelper har sagt ja.');
    },
    oppdrag: function (v) { t.oppdrag = v; t.fraFane = t.skjerm; ga('oppdrag', 'frem'); },
    tilbakeFane: function () { ga(t.fraFane || 'hjem', 'tilbake'); },
    taOppdrag: function () {
      if (t.tatt.indexOf(t.oppdrag) < 0) t.tatt.push(t.oppdrag);
      tegn();
      visToast('Oppdraget er ditt! Du finner det under Oppdrag.');
      var k = innhold.querySelector('.knapp.gronn'); if (k) k.focus();
    },
    ingenting: function () {},
    toast: function (v) { visToast(v); },
    snart: function () { visToast('Kommer snart.'); },
    storre: function () { t.storre = !t.storre; tegn(); },
    paminnelse: function () { t.paminnelse = !t.paminnelse; tegn(); },
    varsel: function () { t.varsel = !t.varsel; tegn(); },
    liker: function (v) { var i = t.liker.indexOf(v); if (i >= 0) t.liker.splice(i, 1); else t.liker.push(v); tegn(); },
    byttRolle: function () { settRolle(t.rolle === 'anne' ? 'emil' : 'anne', true); }
  };

  // Etter at en bryter eller chip er tegnet på nytt, legger vi fokus tilbake på samme knapp
  skjerm.addEventListener('click', function (e) {
    var el = e.target.closest('[data-gjor]');
    if (!el) return;
    var gjor = el.getAttribute('data-gjor'), verdi = el.getAttribute('data-verdi');
    var beholdFokus = ['storre', 'paminnelse', 'varsel', 'liker', 'dag', 'tid'].indexOf(gjor) >= 0;
    HANDLINGER[gjor](verdi);
    if (beholdFokus) {
      var sel = '[data-gjor="' + gjor + '"]' + (verdi ? '[data-verdi="' + verdi.replace(/"/g, '\\"') + '"]' : '');
      var ny = innhold.querySelector(sel); if (ny) ny.focus();
    }
  });
  document.querySelectorAll('[data-rolle]').forEach(function (b) {
    b.addEventListener('click', function () { if (b.getAttribute('data-rolle') !== t.rolle) settRolle(b.getAttribute('data-rolle'), false); });
  });

  tegn();
})();
</script>
</body>
</html>
